[package]
name = "oii"
version = "0.1.1"
edition = "2024"
description = "Config language for Xyle. Brackets for scope. Parser and formatter"
authors = ["Celvra"]
license = "Apache-2.0"
repository = "https://github.com/xyle-os/oii"

[dependencies]
chumsky = "0.9.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
