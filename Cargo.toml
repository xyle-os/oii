[workspace]
members = ["oii-derive"]
resolver = "3"

[package]
name = "oii"
version = "1.0.0"
edition = "2024"
description = "Config language for Xyle. Brackets for scope. Parser, formatter, roundtrip edits, funcs"
authors = ["Celvra"]
license = "Apache-2.0"
repository = "https://github.com/xyle-os/oii"

[features]
default = ["json", "derive"]
# json gates to-json cli and the language server. core parse decode eval edit stay lean
json = ["dep:serde_json", "dep:clap", "dep:clap_complete", "dep:lsp-server", "dep:lsp-types"]
# derive turns on the FromNode derive macro
derive = ["dep:oii-derive"]

[dependencies]
chumsky = "0.9.3"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
lsp-server = { version = "0.10.0", optional = true }
lsp-types = { version = "0.97.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
oii-derive = { version = "1.0.0", path = "oii-derive", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "oii"
path = "src/main.rs"
required-features = ["json"]
